<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Archive 파밍 효율 도우미</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">데이터 처리 중...</div>
</div>

<!-- 토스트 -->
<div id="toast-container"></div>

<!-- 헤더 -->
<div class="ba-header">
  <div class="page-wrap">
    <div class="ba-header-inner">
      <div class="ba-logo-area">
        <div class="ba-logo-icon">📋</div>
        <div class="ba-title-block">
          <div class="ba-title-en">Blue Archive</div>
          <div class="ba-title-ko">파밍 효율 도우미</div>
        </div>
      </div>
      <div class="ba-status-pill">
        <div class="ba-status-dot" id="statusDot"></div>
        <span id="load-status">연결 확인 중...</span>
      </div>
    </div>
  </div>
</div>

<div class="page-wrap">

  <!-- 인증 -->
  <div class="auth-card">
    <div class="auth-body">
      <span class="auth-label">친구코드</span>
      <input class="auth-input" type="text" id="friendCode" placeholder="나만의 고유 코드를 입력하세요">
      <button class="ba-btn ba-btn-ghost" onclick="syncLoad()">불러오기</button>
      <button class="ba-btn ba-btn-primary" onclick="syncSave()">💾 저장</button>
    </div>
    <div class="auth-notice">⚠️ 비밀번호나 개인정보 대신 공개용 코드 또는 친구코드를 사용하세요.</div>
  </div>

  <!-- 화면 인식: 개발 중 (비활성화) -->
  <!-- TODO: 화면 공유 자동 인식 기능 추후 재개 -->
  <div style="display:none">
    <video id="sc-video" autoplay muted playsinline></video>
    <canvas id="sc-canvas"></canvas>
    <canvas id="sc-display"></canvas>
    <div id="sc-sel-overlay"></div>
    <div id="sc-live"></div>
    <div id="sc-select-wrap"></div>
    <div id="sc-result"></div>
  </div>

  <!-- 앱 본문 -->
  <div id="app-content" style="display:none;">

    <!-- 인벤토리 -->
    <div class="section-title">
      <div class="section-title-left">
        <div class="section-title-bar"></div>
        <span class="section-title-text">📦 보유 설계도 인벤토리</span>
      </div>
      <div class="section-title-right">
        <button class="ba-btn-sm ba-btn-sm-danger" onclick="resetHardCounts()">🔄 하드 초기화</button>
        <button class="ba-btn-sm" id="toggleInventoryBtn">▼ 접기</button>
      </div>
    </div>

    <div id="inventoryWrapper" class="inventory-collapsible">
      <div id="inventory-ui"></div>
    </div>

    <!-- 수량 상한 설정 -->
    <div class="cap-wrap">
      <label class="cap-label" for="invCap">📊 보유 수량 상한</label>
      <input class="cap-input" type="number" id="invCap" min="0" placeholder="0 = 제한 없음" value="0">
      <span class="cap-desc">초과 시 이 값으로 인식 · 0이면 그대로</span>
    </div>

    <!-- 분석 배제 티어 선택 -->
    <div class="cap-wrap" style="flex-direction:column;align-items:flex-start;gap:10px">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <span class="cap-label">🚫 분석 배제 티어</span>
        <span class="cap-desc">체크한 티어는 파밍 구역 분석에서 제외됩니다</span>
      </div>
      <div id="tierExcludeWrap" style="display:flex;gap:6px;flex-wrap:wrap">
        <!-- JS에서 렌더링 -->
      </div>
    </div>

    <!-- 분석 버튼 -->
    <div class="btn-calc-wrap">
      <button class="btn-calc" onclick="runAnalysis()">최적 파밍 구역 분석 시작</button>
    </div>

    <div class="stale-notice" id="stale-notice">
      ⚠️ 인벤토리가 변경되었습니다. <b>분석 시작</b> 버튼을 다시 눌러 반영하세요.
    </div>

    <div id="results-area"></div>
  </div>
</div>

<!-- 수량 입력 모달 -->
<div id="quantityModal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-header-title" id="modalTitle">수량 입력</span>
      <button class="modal-close-btn" onclick="closeModal()" aria-label="닫기">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModal()">취소</button>
      <button class="btn-modal-confirm" onclick="confirmModal()">반영하기</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
